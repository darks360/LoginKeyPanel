<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S360 VIP | Real-Time Sync Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0a0b10; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(15, 17, 26, 0.95); border: 1px solid rgba(0, 242, 255, 0.1); backdrop-filter: blur(15px); }
        .input-box { background: #11141d !important; border: 1px solid #222 !important; color: #fff !important; }
        .input-box:focus { border-color: #00f2ff !important; outline: none; }
        .neon-btn { background: linear-gradient(135deg, #00f2ff, #0066ff); transition: 0.3s; }
        .neon-btn:hover { box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); transform: translateY(-2px); }
        .loader { border: 4px solid #111; border-top: 4px solid #00f2ff; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen">

    <!-- LOGIN / AUTH SECTION -->
    <div id="setup-screen" class="fixed inset-0 z-[9999] bg-[#0a0b10] flex items-center justify-center p-6">
        <div class="max-w-md w-full glass p-8 rounded-[2rem] border-t-4 border-cyan-500 shadow-2xl">
            <h2 class="text-2xl font-black text-center mb-2 tracking-tighter">SERVER <span class="text-cyan-400">AUTHENTICATION</span></h2>
            <p class="text-center text-gray-500 text-xs mb-8 uppercase font-bold tracking-widest">Connect to Pastebin Mainframe</p>
            
            <div class="space-y-4">
                <input type="text" id="pb-user" class="w-full input-box p-4 rounded-xl text-sm" placeholder="Pastebin Username">
                <input type="password" id="pb-pass" class="w-full input-box p-4 rounded-xl text-sm" placeholder="Pastebin Password">
                <input type="password" id="pb-devkey" value="KuBOD7AbDjnhSKrm9MxVqf3n48ZTWUx9" class="w-full input-box p-4 rounded-xl text-sm" placeholder="API Dev Key">
                <button onclick="getUserKey()" class="w-full neon-btn py-4 rounded-xl font-black tracking-widest uppercase text-sm">Initialize Connection</button>
            </div>
            <p id="auth-status" class="mt-4 text-center text-xs font-bold text-gray-600 italic"></p>
        </div>
    </div>

    <!-- MAIN CONTROL PANEL -->
    <div id="admin-panel" class="hidden">
        <nav class="p-4 glass sticky top-0 z-[100] border-b border-cyan-900/30">
            <div class="container mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-cyan-500 rounded-lg flex items-center justify-center shadow-lg shadow-cyan-500/20">
                        <i class="fas fa-database text-black"></i>
                    </div>
                    <h1 class="font-black italic text-xl tracking-tighter">DARK S360 <span class="text-cyan-400">PRO</span></h1>
                </div>
                <div class="flex gap-3">
                    <button onclick="fetchData()" class="bg-gray-800 p-2 px-4 rounded-xl text-sm font-bold transition hover:bg-gray-700">REFRESH</button>
                    <button onclick="openModal()" class="bg-gray-800 p-2 px-4 rounded-xl text-sm font-bold transition hover:bg-gray-700">ADD USER</button>
                    <button onclick="updateSamePaste()" class="neon-btn px-6 py-2 rounded-xl text-sm font-black text-white">SAVE TO ID: LGU5MbB1</button>
                </div>
            </div>
        </nav>

        <main class="container mx-auto px-6 py-10">
            <!-- App Config Editor -->
            <div class="glass p-8 rounded-[2rem] mb-10 border-l-4 border-cyan-500">
                <h3 class="text-xs font-black text-gray-500 uppercase tracking-[0.2em] mb-6">Cloud Configuration</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <textarea id="cfg-ann" class="w-full input-box p-4 rounded-2xl h-24 text-sm" placeholder="Announcement"></textarea>
                    <textarea id="cfg-mmsg" class="w-full input-box p-4 rounded-2xl h-24 text-sm" placeholder="Maintenance Msg"></textarea>
                    <select id="cfg-maint" class="w-full input-box p-4 rounded-2xl text-sm font-bold">
                        <option value="false">MAINTENANCE: OFF</option>
                        <option value="true">MAINTENANCE: ON</option>
                    </select>
                    <select id="cfg-ann-status" class="w-full input-box p-4 rounded-2xl text-sm font-bold">
                        <option value="on">ANNOUNCE: VISIBLE</option>
                        <option value="off">ANNOUNCE: HIDDEN</option>
                    </select>
                </div>
            </div>

            <!-- User Grid -->
            <div id="userGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Cards appear here -->
            </div>
        </main>
    </div>

    <!-- MODAL -->
    <div id="modal" class="fixed inset-0 z-[99999] bg-black/90 hidden flex items-center justify-center p-6 backdrop-blur-md">
        <div class="max-w-md w-full glass rounded-[2.5rem] overflow-hidden">
            <div class="p-8 border-b border-white/5 flex justify-between">
                <h3 id="modalTitle" class="font-black italic text-cyan-400">USER PROFILE</h3>
                <button onclick="closeModal()" class="text-2xl">&times;</button>
            </div>
            <div class="p-8 space-y-4">
                <input type="hidden" id="editIdx">
                <input type="text" id="u-user" placeholder="Username" class="w-full input-box p-4 rounded-xl">
                <input type="text" id="u-pass" placeholder="Password" class="w-full input-box p-4 rounded-xl">
                <div class="grid grid-cols-2 gap-4">
                    <select id="u-status" class="w-full input-box p-4 rounded-xl text-sm">
                        <option value="active">Active</option>
                        <option value="blocked">Blocked</option>
                    </select>
                    <input type="text" id="u-exp" placeholder="YYYY-MM-DD" class="w-full input-box p-4 rounded-xl text-sm">
                </div>
                <input type="text" id="u-did" placeholder="Device ID" class="w-full input-box p-4 rounded-xl">
                <button onclick="commitUser()" class="w-full neon-btn py-4 rounded-xl font-black mt-4">COMMIT TO LIST</button>
            </div>
        </div>
    </div>

    <!-- LOADER -->
    <div id="loader" class="fixed inset-0 z-[100000] bg-black/95 hidden flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="text-cyan-500 font-black tracking-widest text-xs animate-pulse">SYNCHRONIZING WITH SERVER...</p>
    </div>

    <script>
        let userSessionKey = "";
        let currentPasteID = "LGU5MbB1";
        let jsonData = { app_config: {}, users: [] };

        // 1. LOGIN TO GET api_user_key
        async function getUserKey() {
            const user = document.getElementById('pb-user').value;
            const pass = document.getElementById('pb-pass').value;
            const dev = document.getElementById('pb-devkey').value;
            const status = document.getElementById('auth-status');

            if(!user || !pass) return alert("Username & Password Required!");

            status.innerText = "Authenticating with Pastebin...";
            
            const params = new URLSearchParams();
            params.append('api_dev_key', dev);
            params.append('api_user_name', user);
            params.append('api_user_password', pass);

            try {
                // Using corsproxy.io to bypass CORS for Login
                const res = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://pastebin.com/api/api_login.php'), {
                    method: 'POST',
                    body: params
                });
                const key = await res.text();

                if (key.length > 20 && !key.includes("Bad")) {
                    userSessionKey = key;
                    document.getElementById('setup-screen').style.display = 'none';
                    document.getElementById('admin-panel').classList.remove('hidden');
                    fetchData();
                } else {
                    status.innerText = "Error: " + key;
                }
            } catch (e) {
                status.innerText = "Connection Failed!";
            }
        }

        // 2. FETCH CURRENT DATA
        async function fetchData() {
            showLoader(true);
            try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://pastebin.com/raw/'+currentPasteID)}&ts=${Date.now()}`);
                const wrap = await res.json();
                jsonData = JSON.parse(wrap.contents);
                renderUI();
            } catch (e) {
                alert("Failed to Load JSON!");
            }
            showLoader(false);
        }

        function renderUI() {
            document.getElementById('cfg-ann').value = jsonData.app_config.announcement;
            document.getElementById('cfg-mmsg').value = jsonData.app_config.m_msg;
            document.getElementById('cfg-maint').value = jsonData.app_config.maintenance.toString();
            document.getElementById('cfg-ann-status').value = jsonData.app_config.announcement_status;

            const grid = document.getElementById('userGrid');
            grid.innerHTML = '';
            jsonData.users.forEach((u, i) => {
                grid.innerHTML += `
                    <div class="glass p-6 rounded-3xl border-b-2 ${u.status === 'active' ? 'border-green-500/30' : 'border-red-500/30'}">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[10px] font-bold px-2 py-1 rounded bg-white/5 ${u.status === 'active' ? 'text-green-400' : 'text-red-400'} uppercase">${u.status}</span>
                            <div class="flex gap-2">
                                <button onclick="editUser(${i})" class="text-gray-600 hover:text-cyan-400"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteUser(${i})" class="text-gray-600 hover:text-red-500"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <h4 class="font-bold text-white mb-3 truncate">${u.user}</h4>
                        <div class="bg-black/40 p-3 rounded-xl text-[10px] font-mono space-y-1">
                            <p><span class="text-gray-600 uppercase">Pass:</span> ${u.pass}</p>
                            <p><span class="text-gray-600 uppercase">Expiry:</span> <span class="text-cyan-500">${u.expiry}</span></p>
                            <p class="truncate"><span class="text-gray-600 uppercase">DID:</span> ${u.device_id}</p>
                        </div>
                    </div>
                `;
            });
        }

        // 3. EDIT / MODIFY LOGIC
        function openModal() {
            document.getElementById('editIdx').value = "-1";
            document.querySelectorAll('#modal input').forEach(i => i.value = "");
            document.getElementById('modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function editUser(i) {
            const u = jsonData.users[i];
            document.getElementById('editIdx').value = i;
            document.getElementById('u-user').value = u.user;
            document.getElementById('u-pass').value = u.pass;
            document.getElementById('u-status').value = u.status;
            document.getElementById('u-exp').value = u.expiry;
            document.getElementById('u-did').value = u.device_id;
            document.getElementById('modal').classList.remove('hidden');
        }

        function deleteUser(i) {
            if(confirm("Confirm deletion?")) {
                jsonData.users.splice(i, 1);
                renderUI();
            }
        }

        function commitUser() {
            const i = document.getElementById('editIdx').value;
            const u = {
                user: document.getElementById('u-user').value,
                pass: document.getElementById('u-pass').value,
                status: document.getElementById('u-status').value,
                expiry: document.getElementById('u-exp').value,
                device_id: document.getElementById('u-did').value
            };
            if(i === "-1") jsonData.users.unshift(u);
            else jsonData.users[i] = u;
            closeModal();
            renderUI();
        }

        // 4. THE ULTIMATE "SAME ID" UPDATE FUNCTION
        async function updateSamePaste() {
            if(!confirm("Push update to the existing ID: LGU5MbB1?")) return;
            showLoader(true);

            // Sync config data
            jsonData.app_config.announcement = document.getElementById('cfg-ann').value;
            jsonData.app_config.m_msg = document.getElementById('cfg-mmsg').value;
            jsonData.app_config.maintenance = document.getElementById('cfg-maint').value === 'true';
            jsonData.app_config.announcement_status = document.getElementById('cfg-ann-status').value;

            const params = new URLSearchParams();
            params.append('api_dev_key', document.getElementById('pb-devkey').value);
            params.append('api_user_key', userSessionKey); // The key generated during login
            params.append('api_option', 'edit'); // 'edit' allows updating same ID
            params.append('api_paste_key', currentPasteID); // ID: LGU5MbB1
            params.append('api_paste_code', JSON.stringify(jsonData, null, 2));

            try {
                const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://pastebin.com/api/api_post.php'), {
                    method: 'POST',
                    body: params
                });

                const result = await response.text();
                
                if(result.includes('https://pastebin.com/')) {
                    alert("✅ SUCCESS!\nData updated in the same ID: " + currentPasteID);
                } else {
                    alert("❌ FAILED: " + result + "\n(Make sure the paste belongs to your account)");
                }
            } catch (err) {
                alert("Network Error!");
            }
            showLoader(false);
        }

        function showLoader(s) { document.getElementById('loader').classList.toggle('hidden', !s); }
    </script>
</body>
</html>
