<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S360 VIP | Same ID Sync Fixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #07080c; color: #fff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 17, 26, 0.98); border: 1px solid rgba(0, 242, 255, 0.1); backdrop-filter: blur(20px); }
        .input-box { background: #0c0e14 !important; border: 1px solid #222 !important; color: #fff !important; }
        .neon-btn { background: linear-gradient(135deg, #00f2ff, #0066ff); transition: 0.3s; font-weight: 800; }
        .neon-btn:hover { box-shadow: 0 0 25px rgba(0, 242, 255, 0.5); transform: translateY(-2px); }
        .loader { border: 4px solid #111; border-top: 4px solid #00f2ff; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen">

    <!-- Login Panel -->
    <div id="auth-panel" class="fixed inset-0 z-[9999] flex items-center justify-center bg-[#07080c] p-6">
        <div class="max-w-md w-full glass p-10 rounded-[2.5rem] border-t-4 border-cyan-500 shadow-2xl">
            <h2 class="text-2xl font-bold text-center mb-8 text-cyan-400 tracking-widest uppercase">Master Sync Login</h2>
            <div class="space-y-4">
                <input type="text" id="pb-user" class="w-full p-4 rounded-2xl text-sm input-box" placeholder="Pastebin Username">
                <input type="password" id="pb-pass" class="w-full p-4 rounded-2xl text-sm input-box" placeholder="Pastebin Password">
                <button onclick="login()" class="w-full neon-btn py-4 rounded-2xl text-white uppercase tracking-widest">Connect to Database</button>
            </div>
            <p id="auth-status" class="mt-6 text-center text-xs text-red-500 font-bold hidden"></p>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="dashboard" class="hidden">
        <nav class="p-4 glass sticky top-0 z-[100] border-b border-cyan-900/30">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="font-black italic text-xl tracking-tighter">DARK S360 <span class="text-cyan-400 font-normal text-sm">PRO SYNC</span></h1>
                <div class="flex gap-2">
                    <button onclick="fetchLatest()" class="bg-gray-800 p-2 px-4 rounded-xl font-bold text-xs">REFRESH</button>
                    <button onclick="openModal()" class="bg-gray-800 p-2 px-4 rounded-xl font-bold text-xs">ADD USER</button>
                    <button onclick="updateSamePaste()" id="saveBtn" class="neon-btn px-6 py-2 rounded-xl text-xs text-white">SAVE TO ID: LGU5MbB1</button>
                </div>
            </div>
        </nav>

        <main class="container mx-auto px-6 py-10">
            <!-- App Config Editor -->
            <div class="glass p-8 rounded-[2rem] mb-10 border-l-4 border-cyan-500">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <textarea id="cfg-ann" class="w-full input-box p-4 rounded-2xl h-24 text-sm" placeholder="Announcement"></textarea>
                    <textarea id="cfg-mmsg" class="w-full input-box p-4 rounded-2xl h-24 text-sm" placeholder="Maintenance Msg"></textarea>
                </div>
            </div>
            <!-- Users Grid -->
            <div id="userGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </main>
    </div>

    <!-- Modals & Loaders -->
    <div id="user-modal" class="fixed inset-0 z-[1000] bg-black/90 hidden flex items-center justify-center p-6">
        <div class="max-w-md w-full glass rounded-[2.5rem] p-8 border border-white/5">
            <h3 id="modalTitle" class="font-bold text-cyan-400 mb-6 uppercase">User Data</h3>
            <div class="space-y-4">
                <input type="hidden" id="editIdx">
                <input type="text" id="u-name" placeholder="User Name" class="w-full p-4 rounded-xl input-box">
                <input type="text" id="u-pass" placeholder="Password" class="w-full p-4 rounded-xl input-box">
                <input type="text" id="u-exp" placeholder="YYYY-MM-DD" class="w-full p-4 rounded-xl input-box">
                <input type="text" id="u-did" placeholder="Hardware ID" class="w-full p-4 rounded-xl input-box">
                <button onclick="confirmUser()" class="w-full neon-btn py-4 rounded-xl text-white">SAVE TO LIST</button>
            </div>
        </div>
    </div>

    <div id="loader" class="fixed inset-0 z-[10000] bg-black/95 hidden flex flex-col items-center justify-center text-center">
        <div class="loader mb-4"></div>
        <p class="text-cyan-400 text-xs font-black tracking-widest animate-pulse">UPDATING CLOUD DATABASE...</p>
    </div>

    <script>
        const DEV_KEY = "KuBOD7AbDjnhSKrm9MxVqf3n48ZTWUx9";
        const PASTE_ID = "LGU5MbB1";
        let userKey = "";
        let masterData = { app_config: {}, users: [] };

        async function login() {
            const user = document.getElementById('pb-user').value;
            const pass = document.getElementById('pb-pass').value;
            const status = document.getElementById('auth-status');
            if(!user || !pass) return alert("Credentials Required!");

            status.innerText = "Connecting...";
            status.classList.remove('hidden');

            const params = new URLSearchParams();
            params.append('api_dev_key', DEV_KEY);
            params.append('api_user_name', user);
            params.append('api_user_password', pass);

            try {
                const res = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://pastebin.com/api/api_login.php'), {
                    method: 'POST',
                    body: params
                });
                const key = await res.text();
                if (key.length > 20 && !key.includes("Bad")) {
                    userKey = key;
                    document.getElementById('auth-panel').style.display = 'none';
                    document.getElementById('dashboard').classList.remove('hidden');
                    fetchLatest();
                } else { status.innerText = "Error: " + key; }
            } catch (e) { status.innerText = "Connection Error!"; }
        }

        async function fetchLatest() {
            showLoader(true);
            try {
                // cache-busting logic
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://pastebin.com/raw/'+PASTE_ID)}&ts=${Date.now()}`);
                const wrap = await res.json();
                masterData = JSON.parse(wrap.contents);
                render();
            } catch (e) { alert("Failed to Load Data!"); }
            showLoader(false);
        }

        function render() {
            document.getElementById('cfg-ann').value = masterData.app_config.announcement;
            document.getElementById('cfg-mmsg').value = masterData.app_config.m_msg;
            const grid = document.getElementById('userGrid');
            grid.innerHTML = '';
            masterData.users.forEach((u, i) => {
                grid.innerHTML += `
                    <div class="glass p-5 rounded-3xl border-b-2 ${u.status === 'active' ? 'border-cyan-500/30' : 'border-red-500/30'}">
                        <div class="flex justify-between mb-4">
                            <span class="text-[10px] font-bold px-2 py-1 bg-black rounded ${u.status === 'active' ? 'text-cyan-400' : 'text-red-500'} uppercase">${u.status}</span>
                            <div class="flex gap-2">
                                <button onclick="editUser(${i})" class="text-gray-500 hover:text-cyan-400"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteUser(${i})" class="text-gray-600 hover:text-red-500"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <h4 class="font-bold text-white mb-2 truncate">${u.user}</h4>
                        <p class="text-[10px] text-gray-500 font-mono">EXP: ${u.expiry}</p>
                    </div>`;
            });
        }

        // এডিট করার পর একই আইডিতে আপডেট করার ফিক্সড ফাংশন
        async function updateSamePaste() {
            if(!confirm("Overwrite ID: LGU5MbB1? (New link will NOT be created)")) return;
            showLoader(true);

            // ডাটা লোকাল থেকে সিঙ্ক
            masterData.app_config.announcement = document.getElementById('cfg-ann').value;
            masterData.app_config.m_msg = document.getElementById('cfg-mmsg').value;

            const params = new URLSearchParams();
            params.append('api_dev_key', DEV_KEY);
            params.append('api_user_key', userKey);
            params.append('api_option', 'paste'); // 'paste' is correct for updates too
            params.append('api_paste_key', PASTE_ID); // দিস ইজ দ্যা কি! এটি থাকলে নতুন ফাইল হবে না।
            params.append('api_paste_code', JSON.stringify(masterData, null, 2));

            try {
                const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://pastebin.com/api/api_post.php'), {
                    method: 'POST',
                    body: params
                });
                const result = await response.text();
                
                // যদি সফলভাবে আপডেট হয়, তবে Pastebin সরাসরি ওই আইডি'র লিঙ্কই রিটার্ন করে
                if(result.includes(PASTE_ID)) {
                    alert("✅ SUCCESS!\nDatabase updated in the same ID: " + PASTE_ID);
                } else {
                    alert("❌ ERROR: " + result + "\n\nNote: If you see a NEW link, it means the ID LGU5MbB1 is not owned by your login account.");
                }
            } catch (err) { alert("Network Error!"); }
            showLoader(false);
        }

        function openModal() { document.getElementById('editIdx').value = "-1"; document.querySelectorAll('#user-modal input').forEach(i => i.value = ""); document.getElementById('user-modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('user-modal').classList.add('hidden'); }
        function editUser(i) {
            const u = masterData.users[i];
            document.getElementById('editIdx').value = i;
            document.getElementById('u-name').value = u.user;
            document.getElementById('u-pass').value = u.pass;
            document.getElementById('u-exp').value = u.expiry;
            document.getElementById('u-did').value = u.device_id;
            document.getElementById('user-modal').classList.remove('hidden');
        }
        function deleteUser(i) { if(confirm("Delete?")) { masterData.users.splice(i, 1); render(); } }
        function confirmUser() {
            const i = document.getElementById('editIdx').value;
            const u = { user: document.getElementById('u-name').value, pass: document.getElementById('u-pass').value, status: 'active', expiry: document.getElementById('u-exp').value, device_id: document.getElementById('u-did').value };
            if(i === "-1") masterData.users.unshift(u); else masterData.users[i] = u;
            closeModal(); render();
        }
        function showLoader(s) { document.getElementById('loader').classList.toggle('hidden', !s); }
    </script>
</body>
</html>
