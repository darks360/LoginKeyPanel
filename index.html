<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK S360 VIP | Master Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #05060a; color: #fff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 17, 26, 0.98); border: 1px solid rgba(0, 242, 255, 0.1); backdrop-filter: blur(20px); }
        .neon-btn { background: linear-gradient(135deg, #00f2ff, #0066ff); transition: 0.3s; box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); }
        .neon-btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(0, 242, 255, 0.6); }
        .loader { border: 4px solid #111; border-top: 4px solid #00f2ff; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen">

    <!-- LOGIN SECTION -->
    <div id="auth-panel" class="fixed inset-0 z-[9999] bg-[#05060a] flex items-center justify-center p-6">
        <div class="max-w-md w-full glass p-10 rounded-[2.5rem] border-t-4 border-cyan-500 shadow-2xl text-center">
            <h2 class="text-2xl font-black mb-8 tracking-widest text-cyan-400">ADMIN AUTH</h2>
            <div class="space-y-4">
                <input type="password" id="access-pin" class="w-full bg-[#0c0e14] border border-gray-800 p-4 rounded-2xl text-center text-3xl tracking-[0.5em] mb-4 outline-none focus:border-cyan-500" placeholder="••••">
                <button onclick="unlock()" class="w-full neon-btn py-4 rounded-2xl font-black text-white">INITIALIZE PANEL</button>
            </div>
            <p id="auth-err" class="text-red-500 mt-4 hidden font-bold">WRONG PIN!</p>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="main-ui" class="hidden">
        <nav class="p-4 glass sticky top-0 z-[100] border-b border-cyan-500/20">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="font-black italic text-xl tracking-tighter">DARK S360 <span class="text-cyan-400 font-normal">VIP PRO</span></h1>
                <div class="flex gap-2">
                    <button onclick="fetchData()" class="bg-gray-800 px-4 py-2 rounded-xl font-bold text-xs"><i class="fas fa-sync"></i></button>
                    <button onclick="openModal()" class="bg-gray-800 px-4 py-2 rounded-xl font-bold text-xs">ADD USER</button>
                    <button onclick="updateData()" class="neon-btn px-6 py-2 rounded-xl text-xs font-black text-white uppercase">Push Changes</button>
                </div>
            </div>
        </nav>

        <main class="container mx-auto px-6 py-10">
            <!-- App Settings -->
            <div class="glass p-8 rounded-[2.5rem] mb-10 border-l-4 border-cyan-500">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="text-[10px] text-gray-500 font-bold ml-2 uppercase">Announcement</label>
                        <textarea id="app-ann" class="w-full bg-black/40 border border-gray-800 p-4 rounded-2xl h-24 text-sm mt-1 outline-none focus:border-cyan-500"></textarea>
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-500 font-bold ml-2 uppercase">Maintenance Msg</label>
                        <textarea id="app-mmsg" class="w-full bg-black/40 border border-gray-800 p-4 rounded-2xl h-24 text-sm mt-1 outline-none focus:border-cyan-500"></textarea>
                    </div>
                </div>
            </div>

            <!-- Configuration -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                <div class="glass p-6 rounded-2xl">
                    <label class="text-[10px] text-gray-500 font-bold">JSONBIN MASTER KEY</label>
                    <input type="password" id="bin-key" placeholder="Enter X-Master-Key" class="w-full bg-black/40 border border-gray-800 p-3 rounded-xl mt-1 text-xs">
                </div>
                <div class="glass p-6 rounded-2xl">
                    <label class="text-[10px] text-gray-500 font-bold">JSONBIN BIN ID</label>
                    <input type="text" id="bin-id" placeholder="Enter Bin ID" class="w-full bg-black/40 border border-gray-800 p-3 rounded-xl mt-1 text-xs font-mono text-cyan-400">
                </div>
            </div>

            <!-- Users Grid -->
            <div id="userGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </main>
    </div>

    <!-- User Modal -->
    <div id="userModal" class="fixed inset-0 z-[1000] bg-black/90 hidden flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="max-w-md w-full glass rounded-[3rem] p-8">
            <h3 id="modalTitle" class="font-black text-cyan-400 mb-6 uppercase tracking-widest italic text-center">User Profile</h3>
            <div class="space-y-4">
                <input type="hidden" id="editIdx">
                <input type="text" id="u-user" placeholder="User Name" class="w-full bg-black/50 border border-gray-800 p-4 rounded-2xl outline-none">
                <input type="text" id="u-pass" placeholder="Password" class="w-full bg-black/50 border border-gray-800 p-4 rounded-2xl outline-none">
                <div class="grid grid-cols-2 gap-4">
                    <select id="u-status" class="w-full bg-black/50 border border-gray-800 p-4 rounded-2xl outline-none">
                        <option value="active">Active</option>
                        <option value="blocked">Blocked</option>
                    </select>
                    <input type="text" id="u-exp" placeholder="YYYY-MM-DD" class="w-full bg-black/50 border border-gray-800 p-4 rounded-2xl outline-none">
                </div>
                <input type="text" id="u-did" placeholder="Hardware ID" class="w-full bg-black/50 border border-gray-800 p-4 rounded-2xl outline-none">
                <button onclick="commitUser()" class="w-full neon-btn py-4 rounded-2xl font-black text-white">SAVE TO LIST</button>
            </div>
        </div>
    </div>

    <!-- Sync Loader -->
    <div id="sync-loader" class="fixed inset-0 z-[10000] bg-black/95 hidden flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="text-cyan-400 font-black tracking-widest animate-pulse uppercase text-xs">Transmitting Data Streams</p>
    </div>

    <script>
        const ADMIN_PIN = "1234"; // প্যানেল পাসওয়ার্ড
        let localDB = { app_config: {}, users: [] };

        function unlock() {
            if(document.getElementById('access-pin').value === ADMIN_PIN) {
                document.getElementById('auth-panel').style.display = 'none';
                document.getElementById('main-ui').classList.remove('hidden');
            } else {
                document.getElementById('auth-err').classList.remove('hidden');
            }
        }

        async function fetchData() {
            const binID = document.getElementById('bin-id').value;
            const mKey = document.getElementById('bin-key').value;
            if(!binID || !mKey) return alert("Please enter Bin ID and Master Key!");

            showLoader(true);
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${binID}/latest`, {
                    headers: { 'X-Master-Key': mKey }
                });
                const result = await res.json();
                localDB = result.record;
                renderUI();
            } catch (e) {
                alert("Error fetching data! Check your Key/ID.");
            }
            showLoader(false);
        }

        function renderUI() {
            document.getElementById('app-ann').value = localDB.app_config.announcement;
            document.getElementById('app-mmsg').value = localDB.app_config.m_msg;
            const grid = document.getElementById('userGrid');
            grid.innerHTML = '';
            localDB.users.forEach((u, i) => {
                grid.innerHTML += `
                    <div class="glass p-6 rounded-3xl relative border-b-2 ${u.status === 'active' ? 'border-green-500/30' : 'border-red-500/30'}">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[10px] font-bold px-2 py-1 bg-black rounded ${u.status === 'active' ? 'text-green-400' : 'text-red-400'} uppercase">${u.status}</span>
                            <div class="flex gap-2">
                                <button onclick="editUser(${i})" class="text-gray-600 hover:text-cyan-400 transition"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteUser(${i})" class="text-gray-600 hover:text-red-500 transition"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <h4 class="font-bold text-white mb-2 truncate">${u.user}</h4>
                        <div class="bg-black/30 p-3 rounded-xl text-[10px] font-mono space-y-1 text-gray-500">
                            <p>PASS: ${u.pass}</p>
                            <p>EXP: ${u.expiry}</p>
                        </div>
                    </div>
                `;
            });
        }

        // রিয়েল-টাইম ডাটা আপডেট (PUT রিকোয়েস্ট)
        async function updateData() {
            const binID = document.getElementById('bin-id').value;
            const mKey = document.getElementById('bin-key').value;
            if(!binID || !mKey) return alert("Missing Key/ID!");

            if(!confirm("Push changes to the LIVE server? ID will remain SAME.")) return;
            showLoader(true);

            // ডাটা লোকাল থেকে সিঙ্ক
            localDB.app_config.announcement = document.getElementById('app-ann').value;
            localDB.app_config.m_msg = document.getElementById('app-mmsg').value;

            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${binID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': mKey
                    },
                    body: JSON.stringify(localDB)
                });

                if(response.ok) {
                    alert("✅ SUCCESS! Live database updated.");
                    fetchData();
                } else {
                    const err = await response.json();
                    alert("❌ FAILED: " + err.message);
                }
            } catch (err) { alert("Network Error!"); }
            showLoader(false);
        }

        // Helpers
        function openModal() { document.getElementById('editIdx').value = "-1"; document.querySelectorAll('#userModal input').forEach(i => i.value = ""); document.getElementById('userModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('userModal').classList.add('hidden'); }
        function editUser(i) {
            const u = localDB.users[i];
            document.getElementById('editIdx').value = i;
            document.getElementById('u-user').value = u.user;
            document.getElementById('u-pass').value = u.pass;
            document.getElementById('u-status').value = u.status;
            document.getElementById('u-exp').value = u.expiry;
            document.getElementById('u-did').value = u.device_id;
            document.getElementById('userModal').classList.remove('hidden');
        }
        function deleteUser(i) { if(confirm("Delete?")) { localDB.users.splice(i, 1); renderUI(); } }
        function commitUser() {
            const i = document.getElementById('editIdx').value;
            const u = { user: document.getElementById('u-user').value, pass: document.getElementById('u-pass').value, status: document.getElementById('u-status').value, expiry: document.getElementById('u-exp').value, device_id: document.getElementById('u-did').value };
            if(i === "-1") localDB.users.unshift(u); else localDB.users[i] = u;
            closeModal(); renderUI();
        }
        function showLoader(s) { document.getElementById('sync-loader').classList.toggle('hidden', !s); }
    </script>
</body>
</html>
