<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S360 VIP | Ultimate Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #050505; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass { background: rgba(15, 15, 20, 0.95); border: 1px solid rgba(0, 242, 255, 0.2); backdrop-filter: blur(10px); }
        .neon-text { color: #00f2ff; text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        .card { transition: 0.3s; border: 1px solid #222; }
        .card:hover { border-color: #00f2ff; box-shadow: 0 0 20px rgba(0, 242, 255, 0.1); }
        input, select, textarea { background: #111 !important; border: 1px solid #333 !important; color: #fff !important; }
        input:focus { border-color: #00f2ff !important; outline: none; }
        .loader { border: 4px solid #111; border-top: 4px solid #00f2ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 z-[9999] bg-black flex items-center justify-center p-6">
        <div class="glass max-w-md w-full p-8 rounded-3xl text-center">
            <h2 class="text-2xl font-bold neon-text mb-6">ADMIN AUTHENTICATION</h2>
            <input type="password" id="login-pass" class="w-full p-4 rounded-xl text-center mb-4 tracking-[0.5em]" placeholder="ENTER PIN">
            <button onclick="login()" class="w-full bg-cyan-600 hover:bg-cyan-500 py-4 rounded-xl font-bold transition">LOGIN</button>
            <p id="login-err" class="text-red-500 mt-4 hidden">Access Denied!</p>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard" class="hidden pb-20">
        <nav class="p-4 glass sticky top-0 z-50 border-b border-cyan-500/30">
            <div class="container mx-auto flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="bg-cyan-500 text-black px-2 py-1 rounded font-black">S360</span>
                    <h1 class="text-xl font-bold neon-text">VIP CONTROL</h1>
                </div>
                <div class="flex gap-2">
                    <button onclick="fetchData()" class="bg-gray-800 px-4 py-2 rounded-lg"><i class="fas fa-sync"></i></button>
                    <button onclick="openModal()" class="bg-cyan-600 px-4 py-2 rounded-lg font-bold text-sm">ADD USER</button>
                    <button onclick="saveOnline()" class="bg-green-600 px-6 py-2 rounded-lg font-bold text-sm">PUSH UPDATE</button>
                </div>
            </div>
        </nav>

        <div class="container mx-auto p-4 md:p-8">
            <!-- App Config Editor -->
            <div class="glass p-6 rounded-3xl mb-10 border-l-4 border-cyan-500">
                <h3 class="neon-text font-bold mb-4 uppercase tracking-wider">App Configuration</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="md:col-span-2">
                        <label class="text-xs text-gray-500">Announcement Message</label>
                        <textarea id="conf-ann" class="w-full p-3 rounded-xl mt-1 h-20 text-sm"></textarea>
                    </div>
                    <div class="md:col-span-2">
                        <label class="text-xs text-gray-500">Maintenance Message</label>
                        <textarea id="conf-mmsg" class="w-full p-3 rounded-xl mt-1 h-20 text-sm"></textarea>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">Maint. Mode</label>
                        <select id="conf-maint" class="w-full p-3 rounded-xl mt-1">
                            <option value="false">Live</option>
                            <option value="true">Maintenance</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">Announce Status</label>
                        <select id="conf-ann-status" class="w-full p-3 rounded-xl mt-1">
                            <option value="on">On</option>
                            <option value="off">Off</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="text-xs text-gray-500">Paste ID (Change manually if needed)</label>
                        <input type="text" id="paste-id" value="LGU5MbB1" class="w-full p-3 rounded-xl mt-1 font-mono text-cyan-400">
                    </div>
                </div>
            </div>

            <!-- Users Grid -->
            <h3 class="text-xl font-bold mb-6 flex items-center gap-2">
                <i class="fas fa-users text-cyan-500"></i> User Database
                <span id="user-count" class="text-xs bg-gray-800 px-2 py-1 rounded text-cyan-400">0</span>
            </h3>
            <div id="user-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Cards appear here -->
            </div>
        </div>
    </div>

    <!-- USER MODAL -->
    <div id="modal" class="fixed inset-0 z-[10000] bg-black/90 hidden flex items-center justify-center p-4">
        <div class="glass max-w-md w-full rounded-3xl overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-gray-800 flex justify-between">
                <h3 id="modal-title" class="font-bold neon-text">ADD VIP USER</h3>
                <button onclick="closeModal()" class="text-2xl text-gray-500 hover:text-white">&times;</button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="edit-idx">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="u-user" placeholder="Username" class="p-3 rounded-xl w-full">
                    <input type="text" id="u-pass" placeholder="Password" class="p-3 rounded-xl w-full">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <select id="u-status" class="p-3 rounded-xl w-full">
                        <option value="active">Active</option>
                        <option value="blocked">Blocked</option>
                    </select>
                    <input type="text" id="u-expiry" placeholder="Expiry: YYYY-MM-DD" class="p-3 rounded-xl w-full">
                </div>
                <input type="text" id="u-device" placeholder="Device ID (ANY)" class="p-3 rounded-xl w-full">
                <button onclick="saveUserLocal()" class="w-full bg-cyan-600 py-4 rounded-2xl font-bold transition mt-4">COMMIT TO LIST</button>
            </div>
        </div>
    </div>

    <!-- LOADING SPINNER -->
    <div id="loader" class="fixed inset-0 z-[10001] bg-black/80 hidden flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="neon-text font-bold tracking-widest animate-pulse">TRANSMITTING DATA...</p>
    </div>

    <script>
        const API_KEY = "KuBOD7AbDjnhSKrm9MxVqf3n48ZTWUx9";
        const MASTER_PIN = "1234"; // আপনার লগইন পিন
        let dataStore = { app_config: {}, users: [] };

        function login() {
            if(document.getElementById('login-pass').value === MASTER_PIN) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                fetchData();
            } else {
                document.getElementById('login-err').classList.remove('hidden');
            }
        }

        async function fetchData() {
            showLoader(true);
            const pid = document.getElementById('paste-id').value;
            try {
                // Using corsproxy.io for better results
                const res = await fetch(`https://corsproxy.io/?https://pastebin.com/raw/${pid}`);
                dataStore = await res.json();
                renderUI();
            } catch (e) {
                alert("Error: Could not fetch data. Check your Paste ID.");
            }
            showLoader(false);
        }

        function renderUI() {
            // App Config
            document.getElementById('conf-ann').value = dataStore.app_config.announcement;
            document.getElementById('conf-mmsg').value = dataStore.app_config.m_msg;
            document.getElementById('conf-maint').value = dataStore.app_config.maintenance.toString();
            document.getElementById('conf-ann-status').value = dataStore.app_config.announcement_status;
            document.getElementById('user-count').innerText = dataStore.users.length;

            // Users Grid
            const grid = document.getElementById('user-grid');
            grid.innerHTML = '';
            dataStore.users.forEach((u, i) => {
                const color = u.status === 'active' ? 'text-green-400' : 'text-red-400';
                grid.innerHTML += `
                    <div class="glass p-5 rounded-2xl card relative">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[10px] font-bold px-2 py-1 bg-black rounded ${color}">${u.status.toUpperCase()}</span>
                            <div class="flex gap-2 text-xs">
                                <button onclick="editUser(${i})" class="text-cyan-500"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteUser(${i})" class="text-red-500"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <h4 class="text-lg font-bold text-white mb-2">${u.user}</h4>
                        <div class="text-[11px] font-mono text-gray-400 space-y-1 bg-black/50 p-3 rounded-lg border border-white/5">
                            <p>PASSWORD: ${u.pass}</p>
                            <p>EXPIRY: <span class="text-cyan-600">${u.expiry}</span></p>
                            <p class="truncate">DEVICE: ${u.device_id}</p>
                        </div>
                    </div>
                `;
            });
        }

        function openModal() {
            document.getElementById('edit-idx').value = "-1";
            document.getElementById('modal-title').innerText = "ADD VIP USER";
            document.querySelectorAll('#modal input').forEach(i => i.value = "");
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function editUser(i) {
            const u = dataStore.users[i];
            document.getElementById('edit-idx').value = i;
            document.getElementById('modal-title').innerText = "EDIT USER PROFILE";
            document.getElementById('u-user').value = u.user;
            document.getElementById('u-pass').value = u.pass;
            document.getElementById('u-status').value = u.status;
            document.getElementById('u-expiry').value = u.expiry;
            document.getElementById('u-device').value = u.device_id;
            document.getElementById('modal').classList.remove('hidden');
        }

        function deleteUser(i) {
            if(confirm("Confirm removal of this user?")) {
                dataStore.users.splice(i, 1);
                renderUI();
            }
        }

        function saveUserLocal() {
            const i = document.getElementById('edit-idx').value;
            const uData = {
                user: document.getElementById('u-user').value,
                pass: document.getElementById('u-pass').value,
                status: document.getElementById('u-status').value,
                expiry: document.getElementById('u-expiry').value,
                device_id: document.getElementById('u-device').value
            };
            if(i === "-1") dataStore.users.unshift(uData);
            else dataStore.users[i] = uData;
            closeModal();
            renderUI();
        }

        async function saveOnline() {
            if(!confirm("Push changes to Pastebin? This will create a NEW ID.")) return;
            showLoader(true);

            // Sync config inputs
            dataStore.app_config.announcement = document.getElementById('conf-ann').value;
            dataStore.app_config.m_msg = document.getElementById('conf-mmsg').value;
            dataStore.app_config.maintenance = document.getElementById('conf-maint').value === 'true';
            dataStore.app_config.announcement_status = document.getElementById('conf-ann-status').value;

            const params = new URLSearchParams();
            params.append('api_dev_key', API_KEY);
            params.append('api_option', 'paste');
            params.append('api_paste_code', JSON.stringify(dataStore, null, 2));
            params.append('api_paste_name', 'S360_VIP_CONFIG');
            params.append('api_paste_format', 'json');
            params.append('api_paste_private', '0'); // Public

            try {
                // Post to Pastebin via corsproxy.io
                const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://pastebin.com/api/api_post.php'), {
                    method: 'POST',
                    body: params
                });

                const result = await response.text();
                
                if(result.includes('https://pastebin.com/')) {
                    const newID = result.split('/').pop();
                    alert("✅ UPDATE SUCCESSFUL!\nNew Paste ID: " + newID);
                    document.getElementById('paste-id').value = newID;
                    renderUI();
                } else {
                    alert("Pastebin Response: " + result);
                }
            } catch (err) {
                alert("Fatal Error: Could not reach the server.");
            }
            showLoader(false);
        }

        function showLoader(s) { document.getElementById('loader').classList.toggle('hidden', !s); }
    </script>
</body>
</html>
