<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S360 VIP | Fixed Realtime Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #08090d; color: #fff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 17, 26, 0.98); border: 1px solid rgba(0, 242, 255, 0.1); }
        .input-box { background: #11141d !important; border: 1px solid #222 !important; color: #fff !important; }
        .neon-btn { background: linear-gradient(135deg, #00f2ff, #0066ff); transition: 0.3s; }
        .neon-btn:hover { box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); }
        .loader { border: 4px solid #111; border-top: 4px solid #00f2ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen">

    <!-- Auth System -->
    <div id="setup-screen" class="fixed inset-0 z-[9999] bg-[#08090d] flex items-center justify-center p-6">
        <div class="max-w-md w-full glass p-8 rounded-[2rem] border-t-4 border-cyan-500 shadow-2xl">
            <h2 class="text-2xl font-black text-center mb-6 tracking-tighter">SERVER <span class="text-cyan-400">LOGIN</span></h2>
            <div class="space-y-4">
                <input type="text" id="pb-user" class="w-full input-box p-4 rounded-xl text-sm" placeholder="Pastebin Username">
                <input type="password" id="pb-pass" class="w-full input-box p-4 rounded-xl text-sm" placeholder="Pastebin Password">
                <button onclick="initializeSystem()" class="w-full neon-btn py-4 rounded-xl font-black tracking-widest text-sm text-white">CONNECT SERVER</button>
            </div>
            <p id="auth-status" class="mt-4 text-center text-xs font-bold text-gray-500 italic"></p>
        </div>
    </div>

    <!-- Main Panel -->
    <div id="admin-panel" class="hidden">
        <nav class="p-4 glass sticky top-0 z-[100] border-b border-cyan-900/30">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="font-black italic text-xl">DARK S360 <span class="text-cyan-400">PRO</span></h1>
                <div class="flex gap-2">
                    <button onclick="fetchData()" class="bg-gray-800 p-2 px-4 rounded-xl text-sm font-bold">REFRESH</button>
                    <button onclick="openModal()" class="bg-gray-800 p-2 px-4 rounded-xl text-sm font-bold">ADD USER</button>
                    <button onclick="saveChanges()" class="neon-btn px-6 py-2 rounded-xl text-sm font-black text-white">SAVE (REALTIME)</button>
                </div>
            </div>
        </nav>

        <main class="container mx-auto px-6 py-10">
            <!-- Config Editor -->
            <div class="glass p-8 rounded-[2rem] mb-10 border-l-4 border-cyan-500">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <textarea id="cfg-ann" class="w-full input-box p-4 rounded-2xl h-24 text-sm" placeholder="Announcement"></textarea>
                    <textarea id="cfg-mmsg" class="w-full input-box p-4 rounded-2xl h-24 text-sm" placeholder="Maintenance Msg"></textarea>
                </div>
            </div>
            <!-- User Cards -->
            <div id="userGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </main>
    </div>

    <!-- User Modal -->
    <div id="modal" class="fixed inset-0 z-[99999] bg-black/90 hidden flex items-center justify-center p-6 backdrop-blur-md">
        <div class="max-w-md w-full glass rounded-[2.5rem] p-8">
            <div class="flex justify-between mb-6">
                <h3 id="modalTitle" class="font-black text-cyan-400 uppercase italic">User Profile</h3>
                <button onclick="closeModal()" class="text-2xl">&times;</button>
            </div>
            <div class="space-y-4">
                <input type="hidden" id="editIdx">
                <input type="text" id="u-user" placeholder="Username" class="w-full input-box p-4 rounded-xl">
                <input type="text" id="u-pass" placeholder="Password" class="w-full input-box p-4 rounded-xl">
                <div class="grid grid-cols-2 gap-4">
                    <select id="u-status" class="w-full input-box p-4 rounded-xl">
                        <option value="active">Active</option>
                        <option value="blocked">Blocked</option>
                    </select>
                    <input type="text" id="u-exp" placeholder="YYYY-MM-DD" class="w-full input-box p-4 rounded-xl">
                </div>
                <input type="text" id="u-did" placeholder="Hardware ID" class="w-full input-box p-4 rounded-xl">
                <button onclick="commitUser()" class="w-full neon-btn py-4 rounded-xl font-black text-white">COMMIT TO LIST</button>
            </div>
        </div>
    </div>

    <div id="loader" class="fixed inset-0 z-[100000] bg-black/95 hidden flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="text-cyan-500 font-bold animate-pulse text-xs tracking-widest">TRANSMITTING DATA...</p>
    </div>

    <script>
        const DEV_KEY = "KuBOD7AbDjnhSKrm9MxVqf3n48ZTWUx9";
        const PASTE_ID = "LGU5MbB1";
        let userKey = "";
        let db = { app_config: {}, users: [] };

        // ১. লগইন এবং ইউজার কী সংগ্রহ (Fixed logic)
        async function initializeSystem() {
            const user = document.getElementById('pb-user').value;
            const pass = document.getElementById('pb-pass').value;
            if(!user || !pass) return alert("Username & Password Required!");

            const status = document.getElementById('auth-status');
            status.innerText = "Authenticating with Pastebin Cloud...";
            
            const params = new URLSearchParams();
            params.append('api_dev_key', DEV_KEY);
            params.append('api_user_name', user);
            params.append('api_user_password', pass);

            try {
                const res = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://pastebin.com/api/api_login.php'), {
                    method: 'POST',
                    body: params
                });
                const key = await res.text();

                if (key.length > 20 && !key.includes("Bad")) {
                    userKey = key;
                    document.getElementById('setup-screen').style.display = 'none';
                    document.getElementById('admin-panel').classList.remove('hidden');
                    fetchData();
                } else {
                    status.innerText = "Error: " + key;
                }
            } catch (e) { status.innerText = "CORS Proxy Error!"; }
        }

        // ২. ডাটা ফেচিং
        async function fetchData() {
            showLoader(true);
            try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://pastebin.com/raw/'+PASTE_ID)}&ts=${Date.now()}`);
                const wrap = await res.json();
                db = JSON.parse(wrap.contents);
                render();
            } catch (e) { alert("Failed to connect to JSON!"); }
            showLoader(false);
        }

        function render() {
            document.getElementById('cfg-ann').value = db.app_config.announcement;
            document.getElementById('cfg-mmsg').value = db.app_config.m_msg;
            const grid = document.getElementById('userGrid');
            grid.innerHTML = '';
            db.users.forEach((u, i) => {
                grid.innerHTML += `
                    <div class="glass p-6 rounded-3xl border-b-2 ${u.status === 'active' ? 'border-cyan-500/30' : 'border-red-500/30'}">
                        <div class="flex justify-between mb-4">
                            <span class="text-[10px] font-bold px-2 py-1 bg-black rounded ${u.status === 'active' ? 'text-cyan-400' : 'text-red-500'}">${u.status.toUpperCase()}</span>
                            <div class="flex gap-2">
                                <button onclick="editUser(${i})" class="text-gray-600 hover:text-cyan-400"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteUser(${i})" class="text-gray-600 hover:text-red-500"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <h4 class="font-bold text-white mb-3 truncate">${u.user}</h4>
                        <div class="bg-black/50 p-3 rounded-xl text-[10px] font-mono space-y-1 text-gray-400">
                            <p>PASS: ${u.pass}</p>
                            <p>EXP: <span class="text-cyan-500">${u.expiry}</span></p>
                        </div>
                    </div>`;
            });
        }

        // ৩. রিয়েল-টাইম সেভ (একই আইডিতে আপডেট - ফিক্সড)
        async function saveChanges() {
            if(!confirm("Push update to ID: LGU5MbB1?")) return;
            showLoader(true);

            // ডাটা আপডেট
            db.app_config.announcement = document.getElementById('cfg-ann').value;
            db.app_config.m_msg = document.getElementById('cfg-mmsg').value;

            const params = new URLSearchParams();
            params.append('api_dev_key', DEV_KEY);
            params.append('api_user_key', userKey);
            params.append('api_option', 'paste'); // এডিট করার জন্য 'paste' অপশনই ব্যবহার হয়
            params.append('api_paste_key', PASTE_ID); // বিদ্যমান পেস্ট আইডি
            params.append('api_paste_code', JSON.stringify(db, null, 2));

            try {
                const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://pastebin.com/api/api_post.php'), {
                    method: 'POST',
                    body: params
                });
                const result = await response.text();
                
                if(result.includes('https://pastebin.com/')) {
                    alert("✅ SUCCESS! Real-time Update Complete.");
                } else {
                    alert("❌ FAILED: " + result + "\n\nError Note: Make sure the paste belongs to your login account.");
                }
            } catch (err) { alert("Network Sync Error!"); }
            showLoader(false);
        }

        // Modal functions
        function openModal() { document.getElementById('editIdx').value = "-1"; document.querySelectorAll('#modal input').forEach(i => i.value = ""); document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        function editUser(i) {
            const u = db.users[i];
            document.getElementById('editIdx').value = i;
            document.getElementById('u-user').value = u.user;
            document.getElementById('u-pass').value = u.pass;
            document.getElementById('u-status').value = u.status;
            document.getElementById('u-exp').value = u.expiry;
            document.getElementById('u-did').value = u.device_id;
            document.getElementById('modal').classList.remove('hidden');
        }
        function deleteUser(i) { if(confirm("Delete?")) { db.users.splice(i, 1); render(); } }
        function commitUser() {
            const i = document.getElementById('editIdx').value;
            const u = { user: document.getElementById('u-user').value, pass: document.getElementById('u-pass').value, status: document.getElementById('u-status').value, expiry: document.getElementById('u-exp').value, device_id: document.getElementById('u-did').value };
            if(i === "-1") db.users.unshift(u); else db.users[i] = u;
            closeModal(); render();
        }
        function showLoader(s) { document.getElementById('loader').classList.toggle('hidden', !s); }
    </script>
</body>
</html>
