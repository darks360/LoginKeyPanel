<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark S360 - Admin Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .status-active { color: #4ade80; background: rgba(74, 222, 128, 0.1); }
        .status-blocked { color: #f87171; background: rgba(248, 113, 113, 0.1); }
        .loader { border-top-color: #3b82f6; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- Header -->
    <header class="glass sticky top-0 z-50 p-4 mb-6 shadow-2xl border-b border-blue-500/30">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg shadow-lg shadow-blue-500/50">
                    <i class="fas fa-user-shield text-xl"></i>
                </div>
                <h1 id="brand-title" class="text-xl font-black italic tracking-widest text-white">⚡ DARK S360 VIP ⚡</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="openUserModal()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg font-bold text-sm transition">
                    <i class="fas fa-plus mr-1"></i> ADD USER
                </button>
                <button onclick="saveAllToPastebin()" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded-lg font-bold text-sm transition shadow-lg shadow-green-500/20">
                    <i class="fas fa-save mr-1"></i> SAVE ONLINE
                </button>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-4">
        
        <!-- API Setup -->
        <div class="glass p-6 rounded-2xl mb-8 flex flex-wrap gap-4 items-end justify-center lg:justify-start">
            <div class="flex-1 min-w-[250px]">
                <label class="block text-xs font-bold text-blue-400 mb-2 uppercase tracking-widest">Pastebin API Dev Key</label>
                <input type="password" id="apiKey" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl focus:border-blue-500 outline-none" placeholder="Paste your API Key here">
            </div>
            <div class="w-40">
                <label class="block text-xs font-bold text-blue-400 mb-2 uppercase tracking-widest">Current Paste ID</label>
                <input type="text" id="pasteId" value="LGU5MbB1" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl focus:border-blue-500 outline-none">
            </div>
            <button onclick="fetchData()" class="bg-slate-700 hover:bg-slate-600 px-6 py-3 rounded-xl font-bold transition">
                <i class="fas fa-sync-alt"></i> LOAD
            </button>
        </div>

        <!-- App Config Section -->
        <div class="glass p-6 rounded-2xl mb-10 border-l-4 border-yellow-500">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fas fa-cog text-yellow-500"></i> App Global Settings</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase">Announcement Text</label>
                    <textarea id="conf_ann" class="w-full bg-slate-900 border border-slate-700 p-2 rounded mt-1 text-sm h-20"></textarea>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-400 uppercase">Maintenance Message</label>
                    <textarea id="conf_msg" class="w-full bg-slate-900 border border-slate-700 p-2 rounded mt-1 text-sm h-20"></textarea>
                </div>
                <div class="space-y-4">
                    <div class="flex items-center justify-between bg-slate-800 p-3 rounded-lg">
                        <span class="text-sm font-bold">Maintenance Mode</span>
                        <select id="conf_maint" class="bg-slate-900 text-xs p-1 rounded">
                            <option value="false">OFF (Live)</option>
                            <option value="true">ON (Blocked)</option>
                        </select>
                    </div>
                    <div class="flex items-center justify-between bg-slate-800 p-3 rounded-lg">
                        <span class="text-sm font-bold">Announcement Status</span>
                        <select id="conf_ann_status" class="bg-slate-900 text-xs p-1 rounded">
                            <option value="on">Visible</option>
                            <option value="off">Hidden</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- User Management -->
        <div class="mb-6 flex justify-between items-center">
            <h2 class="text-2xl font-black text-white italic">USER DATABASE</h2>
            <span id="userCount" class="bg-blue-600 text-xs font-bold px-3 py-1 rounded-full">0 Users</span>
        </div>

        <div id="userGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Cards will be injected here -->
        </div>
    </div>

    <!-- User Modal -->
    <div id="userModal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center p-4 z-[100] backdrop-blur-sm">
        <div class="glass w-full max-w-md rounded-3xl overflow-hidden border border-blue-500/30">
            <div class="bg-blue-600 p-5 flex justify-between items-center">
                <h3 id="modalTitle" class="font-black italic">ADD NEW USER</h3>
                <button onclick="closeModal()" class="text-2xl">&times;</button>
            </div>
            <div class="p-8 space-y-4">
                <input type="hidden" id="editIndex">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-blue-400 uppercase">Username</label>
                        <input type="text" id="u_name" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-blue-400 uppercase">Password</label>
                        <input type="text" id="u_pass" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mt-1">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-blue-400 uppercase">Status</label>
                        <select id="u_status" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mt-1">
                            <option value="active">Active</option>
                            <option value="blocked">Blocked</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-blue-400 uppercase">Expiry (YYYY-MM-DD)</label>
                        <input type="text" id="u_expiry" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mt-1">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-blue-400 uppercase">Device ID (ANY / ID)</label>
                    <input type="text" id="u_device" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mt-1">
                </div>
                <button onclick="saveUserLocal()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-black transition shadow-xl shadow-blue-500/20">
                    SAVE TO LIST
                </button>
            </div>
        </div>
    </div>

    <!-- Loader -->
    <div id="loading" class="fixed inset-0 bg-black/80 hidden flex-col items-center justify-center z-[200]">
        <div class="loader w-16 h-16 border-4 border-slate-700 rounded-full mb-4"></div>
        <p class="font-bold tracking-widest animate-pulse">SYNCING DATA...</p>
    </div>

    <script>
        let mainData = { app_config: {}, users: [] };

        async function fetchData() {
            const pid = document.getElementById('pasteId').value;
            showLoading(true);
            try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://pastebin.com/raw/' + pid)}&_=${new Date().getTime()}`);
                const jsonRes = await res.json();
                mainData = JSON.parse(jsonRes.contents);
                
                loadAppConfig();
                renderUsers();
            } catch (e) {
                alert("Error fetching data! Please check Paste ID.");
            }
            showLoading(false);
        }

        function loadAppConfig() {
            document.getElementById('brand-title').innerText = mainData.app_config.title;
            document.getElementById('conf_ann').value = mainData.app_config.announcement;
            document.getElementById('conf_msg').value = mainData.app_config.m_msg;
            document.getElementById('conf_maint').value = mainData.app_config.maintenance.toString();
            document.getElementById('conf_ann_status').value = mainData.app_config.announcement_status;
        }

        function renderUsers() {
            const grid = document.getElementById('userGrid');
            grid.innerHTML = '';
            document.getElementById('userCount').innerText = `${mainData.users.length} Users`;

            mainData.users.forEach((u, i) => {
                const statusClass = u.status === 'active' ? 'status-active' : 'status-blocked';
                grid.innerHTML += `
                    <div class="glass p-5 rounded-2xl relative overflow-hidden group border-t-2 ${u.status === 'active' ? 'border-blue-500' : 'border-red-500'}">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h4 class="font-black text-lg text-white">${u.user}</h4>
                                <span class="text-[10px] px-2 py-0.5 rounded font-bold uppercase ${statusClass}">${u.status}</span>
                            </div>
                            <i class="fas fa-user-circle text-3xl text-slate-700"></i>
                        </div>
                        <div class="space-y-2 text-xs text-slate-400 font-mono bg-black/30 p-3 rounded-lg mb-4">
                            <p><span class="text-blue-500">KEY:</span> ${u.pass}</p>
                            <p><span class="text-blue-500">EXP:</span> ${u.expiry}</p>
                            <p class="truncate"><span class="text-blue-500">DID:</span> ${u.device_id}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editUser(${i})" class="flex-1 bg-slate-800 hover:bg-blue-600 py-2 rounded-lg font-bold transition">EDIT</button>
                            <button onclick="deleteUser(${i})" class="bg-slate-800 hover:bg-red-600 p-2 rounded-lg transition text-red-400 hover:text-white">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function openUserModal() {
            document.getElementById('editIndex').value = "-1";
            document.getElementById('modalTitle').innerText = "ADD NEW USER";
            document.querySelectorAll('#userModal input').forEach(i => i.value = "");
            document.getElementById('u_status').value = "active";
            document.getElementById('userModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('userModal').classList.add('hidden');
        }

        function editUser(i) {
            const u = mainData.users[i];
            document.getElementById('editIndex').value = i;
            document.getElementById('u_name').value = u.user;
            document.getElementById('u_pass').value = u.pass;
            document.getElementById('u_status').value = u.status;
            document.getElementById('u_expiry').value = u.expiry;
            document.getElementById('u_device').value = u.device_id;
            document.getElementById('modalTitle').innerText = "EDIT USER DATA";
            document.getElementById('userModal').classList.remove('hidden');
        }

        function saveUserLocal() {
            const idx = document.getElementById('editIndex').value;
            const newUser = {
                user: document.getElementById('u_name').value,
                pass: document.getElementById('u_pass').value,
                status: document.getElementById('u_status').value,
                device_id: document.getElementById('u_device').value,
                expiry: document.getElementById('u_expiry').value
            };

            if(idx === "-1") mainData.users.unshift(newUser);
            else mainData.users[idx] = newUser;

            closeModal();
            renderUsers();
        }

        function deleteUser(i) {
            if(confirm("Are you sure? This user will be removed locally.")) {
                mainData.users.splice(i, 1);
                renderUsers();
            }
        }

        async function saveAllToPastebin() {
            const key = document.getElementById('apiKey').value;
            if(!key) return alert("Please enter your Pastebin API Dev Key!");

            // Update App Config from inputs
            mainData.app_config.announcement = document.getElementById('conf_ann').value;
            mainData.app_config.m_msg = document.getElementById('conf_msg').value;
            mainData.app_config.maintenance = document.getElementById('conf_maint').value === 'true';
            mainData.app_config.announcement_status = document.getElementById('conf_ann_status').value;

            if(!confirm("Push all changes to Pastebin?")) return;

            showLoading(true);

            const formData = new URLSearchParams();
            formData.append('api_dev_key', key);
            formData.append('api_option', 'paste');
            formData.append('api_paste_code', JSON.stringify(mainData, null, 2));
            formData.append('api_paste_name', 'DARK_S360_UPDATE');
            formData.append('api_paste_format', 'json');
            formData.append('api_paste_private', '0');

            try {
                // Using CORS proxy to bypass Pastebin's security
                const res = await fetch('https://cors-anywhere.herokuapp.com/https://pastebin.com/api/api_post.php', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });

                const result = await res.text();
                if(result.includes('pastebin.com/')) {
                    const newId = result.split('/').pop();
                    alert("✅ DATA UPDATED SUCCESSFULLY!\nNew Paste ID: " + newId + "\nUpdate this in your script.");
                    document.getElementById('pasteId').value = newId;
                } else {
                    alert("❌ ERROR: " + result);
                }
            } catch (e) {
                alert("CORS Proxy Error! Make sure you activated 'cors-anywhere' temporary access.");
            }
            showLoading(false);
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
        }

        // Initialize with your ID
        window.onload = () => { if(confirm("Load initial data from LGU5MbB1?")) fetchData(); };
    </script>
</body>
</html>
