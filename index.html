<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S360 VIP | Real-time Cloud Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #05060a; }
        body { font-family: 'Rajdhani', sans-serif; background: var(--bg); color: #fff; overflow-x: hidden; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(15, 17, 26, 0.95); border: 1px solid rgba(0, 242, 255, 0.1); backdrop-filter: blur(15px); }
        .neon-border { border: 1px solid rgba(0, 242, 255, 0.2); transition: 0.3s; }
        .neon-border:hover { border-color: var(--neon); box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }
        input, select, textarea { background: #0c0e14 !important; border: 1px solid #1f232d !important; color: #fff !important; outline: none !important; }
        input:focus { border-color: var(--neon) !important; }
        .btn-update { background: linear-gradient(135deg, #00f2ff, #0066ff); transition: 0.3s; }
        .btn-update:hover { transform: scale(1.02); box-shadow: 0 0 25px rgba(0, 242, 255, 0.4); }
        .loader { border: 4px solid #111; border-top: 4px solid var(--neon); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen">

    <!-- Auth System -->
    <div id="auth-panel" class="fixed inset-0 z-[9999] flex items-center justify-center p-6 bg-[#05060a]">
        <div class="max-w-md w-full glass p-10 rounded-[2.5rem] border-t-4 border-cyan-500 shadow-2xl">
            <div class="text-center mb-8">
                <i class="fas fa-server text-5xl text-cyan-400 mb-4"></i>
                <h2 class="orbitron text-xl font-bold tracking-tighter">CLOUD <span class="text-cyan-400">SYNC</span></h2>
                <p class="text-gray-500 text-xs font-bold uppercase mt-2">Log in to your Pastebin account</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="pb-user" class="w-full p-4 rounded-2xl text-sm" placeholder="Pastebin Username">
                <input type="password" id="pb-pass" class="w-full p-4 rounded-2xl text-sm" placeholder="Pastebin Password">
                <button onclick="loginAndStart()" class="w-full btn-update py-4 rounded-2xl font-black text-white tracking-widest uppercase text-sm">Initialize Real-time Access</button>
            </div>
            <p id="auth-log" class="text-center mt-6 text-xs text-red-500 font-bold hidden"></p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden">
        <nav class="p-4 glass sticky top-0 z-[100] border-b border-cyan-900/30">
            <div class="container mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="h-10 w-10 bg-cyan-500 rounded-xl flex items-center justify-center text-black font-black">VIP</div>
                    <h1 class="orbitron text-lg hidden md:block">S360 MASTER PANEL</h1>
                </div>
                <div class="flex gap-2">
                    <button onclick="fetchLatestData()" class="bg-gray-800 p-2 px-4 rounded-xl font-bold text-xs">REFRESH</button>
                    <button onclick="openModal()" class="bg-cyan-600/20 text-cyan-400 border border-cyan-500/50 px-4 py-2 rounded-xl font-bold text-xs">ADD USER</button>
                    <button onclick="syncToCloud()" class="btn-update px-6 py-2 rounded-xl text-xs font-black text-white">SAVE (REAL-TIME)</button>
                </div>
            </div>
        </nav>

        <main class="container mx-auto px-6 py-10">
            <!-- Stats -->
            <div id="stats-bar" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10"></div>

            <!-- Global Config -->
            <div class="glass p-8 rounded-[2rem] mb-10 neon-border">
                <h3 class="orbitron text-cyan-400 text-sm mb-6 flex items-center gap-2 italic"><i class="fas fa-cog"></i> Server Config</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <label class="text-[10px] font-bold text-gray-500 ml-2">ANNOUNCEMENT</label>
                        <textarea id="app-ann" class="w-full p-4 rounded-2xl h-24 text-sm"></textarea>
                    </div>
                    <div class="space-y-4">
                        <label class="text-[10px] font-bold text-gray-500 ml-2">MAINTENANCE MESSAGE</label>
                        <textarea id="app-mmsg" class="w-full p-4 rounded-2xl h-24 text-sm"></textarea>
                    </div>
                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label class="text-[10px] font-bold text-gray-500 ml-2">MAINT. MODE</label>
                            <select id="app-maint" class="w-full p-4 rounded-2xl text-sm font-bold">
                                <option value="false">LIVE</option>
                                <option value="true">MAINTENANCE</option>
                            </select>
                        </div>
                        <div class="flex-1">
                            <label class="text-[10px] font-bold text-gray-500 ml-2">NOTICE STATUS</label>
                            <select id="app-ann-status" class="w-full p-4 rounded-2xl text-sm font-bold">
                                <option value="on">VISIBLE</option>
                                <option value="off">HIDDEN</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Users -->
            <div class="flex justify-between items-center mb-6">
                <h3 class="orbitron text-xl font-bold italic">USER DATABASE</h3>
            </div>
            <div id="userGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </main>
    </div>

    <!-- Modals & Loaders -->
    <div id="userModal" class="fixed inset-0 z-[1000] bg-black/90 hidden flex items-center justify-center p-6">
        <div class="max-w-md w-full glass rounded-[2.5rem] overflow-hidden">
            <div class="p-6 border-b border-white/5 flex justify-between orbitron">
                <h3 id="modalTitle">USER PROFILE</h3>
                <button onclick="closeModal()" class="text-2xl">&times;</button>
            </div>
            <div class="p-8 space-y-4">
                <input type="hidden" id="editIdx">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="u-name" placeholder="User ID" class="w-full p-4 rounded-2xl">
                    <input type="text" id="u-pass" placeholder="Pass" class="w-full p-4 rounded-2xl">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <select id="u-status" class="w-full p-4 rounded-2xl">
                        <option value="active">Active</option>
                        <option value="blocked">Blocked</option>
                    </select>
                    <input type="text" id="u-exp" placeholder="Expiry" class="w-full p-4 rounded-2xl">
                </div>
                <input type="text" id="u-did" placeholder="Device ID" class="w-full p-4 rounded-2xl">
                <button onclick="commitUser()" class="w-full btn-update py-4 rounded-2xl font-black text-white">SAVE TO LIST</button>
            </div>
        </div>
    </div>

    <div id="loader" class="fixed inset-0 z-[10000] bg-black/90 hidden flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="orbitron text-cyan-400 text-xs tracking-widest animate-pulse">TRANSMITTING TO SERVER...</p>
    </div>

    <script>
        const API_DEV_KEY = "KuBOD7AbDjnhSKrm9MxVqf3n48ZTWUx9";
        const PASTE_ID = "LGU5MbB1";
        let apiUserKey = "";
        let masterData = { app_config: {}, users: [] };

        // 🔐 ১. ইউজার সেশন কি জেনারেট করা (লগইন)
        async function loginAndStart() {
            const user = document.getElementById('pb-user').value;
            const pass = document.getElementById('pb-pass').value;
            const log = document.getElementById('auth-log');
            if(!user || !pass) return alert("Enter credentials!");

            log.innerText = "Connecting to Pastebin...";
            log.classList.remove('hidden');

            const params = new URLSearchParams();
            params.append('api_dev_key', API_DEV_KEY);
            params.append('api_user_name', user);
            params.append('api_user_password', pass);

            try {
                const res = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://pastebin.com/api/api_login.php'), {
                    method: 'POST',
                    body: params
                });
                const key = await res.text();

                if(key.length > 20 && !key.includes("Bad")) {
                    apiUserKey = key;
                    document.getElementById('auth-panel').style.display = 'none';
                    document.getElementById('dashboard').classList.remove('hidden');
                    fetchLatestData();
                } else {
                    log.innerText = "Auth Error: " + key;
                }
            } catch (e) { log.innerText = "Connection Failed!"; }
        }

        // 📡 ২. ডাটা ফেচিং
        async function fetchLatestData() {
            toggleLoader(true);
            try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://pastebin.com/raw/'+PASTE_ID)}&ts=${Date.now()}`);
                const wrap = await res.json();
                masterData = JSON.parse(wrap.contents);
                render();
            } catch (e) { alert("Failed to Load JSON!"); }
            toggleLoader(false);
        }

        function render() {
            document.getElementById('app-ann').value = masterData.app_config.announcement;
            document.getElementById('app-mmsg').value = masterData.app_config.m_msg;
            document.getElementById('app-maint').value = masterData.app_config.maintenance.toString();
            document.getElementById('app-ann-status').value = masterData.app_config.announcement_status;

            // Stats
            const active = masterData.users.filter(u => u.status === 'active').length;
            document.getElementById('stats-bar').innerHTML = `
                <div class="glass p-4 rounded-2xl text-center"><p class="text-[10px] text-gray-500">TOTAL</p><h2 class="text-xl orbitron">${masterData.users.length}</h2></div>
                <div class="glass p-4 rounded-2xl text-center"><p class="text-[10px] text-gray-500 text-green-500">ACTIVE</p><h2 class="text-xl orbitron text-green-400">${active}</h2></div>
                <div class="glass p-4 rounded-2xl text-center"><p class="text-[10px] text-gray-500 text-red-500">BLOCKED</p><h2 class="text-xl orbitron text-red-400">${masterData.users.length - active}</h2></div>
                <div class="glass p-4 rounded-2xl text-center"><p class="text-[10px] text-gray-500">ID</p><h2 class="text-[10px] orbitron mt-2">${PASTE_ID}</h2></div>
            `;

            const grid = document.getElementById('userGrid');
            grid.innerHTML = '';
            masterData.users.forEach((u, i) => {
                const statusColor = u.status === 'active' ? 'text-cyan-400 bg-cyan-500/10' : 'text-red-400 bg-red-500/10';
                grid.innerHTML += `
                    <div class="glass p-5 rounded-3xl neon-border relative group">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[10px] font-bold px-2 py-1 rounded-lg ${statusColor}">${u.status.toUpperCase()}</span>
                            <div class="flex gap-2">
                                <button onclick="editUser(${i})" class="text-gray-600 hover:text-cyan-400"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteUser(${i})" class="text-gray-600 hover:text-red-500"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <h4 class="orbitron text-white text-lg mb-2 truncate">${u.user}</h4>
                        <div class="bg-black/40 p-3 rounded-xl text-[11px] font-mono space-y-1">
                            <p class="flex justify-between"><span class="text-gray-600 uppercase">Pass:</span> <span>${u.pass}</span></p>
                            <p class="flex justify-between"><span class="text-gray-600 uppercase">Exp:</span> <span class="text-cyan-600">${u.expiry}</span></p>
                            <p class="truncate"><span class="text-gray-600 uppercase">DID:</span> <span>${u.device_id}</span></p>
                        </div>
                    </div>
                `;
            });
        }

        // 🚀 ৩. রিয়েল-টাইম ডাটা সেভ (একই আইডিতে আপডেট)
        async function syncToCloud() {
            if(!confirm("Push update to the Cloud Database? (ID: LGU5MbB1)")) return;
            toggleLoader(true);

            // ডাটা লোকাল থেকে সিঙ্ক
            masterData.app_config.announcement = document.getElementById('app-ann').value;
            masterData.app_config.m_msg = document.getElementById('app-mmsg').value;
            masterData.app_config.maintenance = document.getElementById('app-maint').value === 'true';
            masterData.app_config.announcement_status = document.getElementById('app-ann-status').value;

            const params = new URLSearchParams();
            params.append('api_dev_key', API_DEV_KEY);
            params.append('api_user_key', apiUserKey); // সিক্রেট সেশন কি
            params.append('api_option', 'paste');      // কমান্ড
            params.append('api_paste_key', PASTE_ID);  // তোমার আইডি
            params.append('api_paste_code', JSON.stringify(masterData, null, 2));

            try {
                const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://pastebin.com/api/api_post.php'), {
                    method: 'POST',
                    body: params
                });

                const result = await response.text();
                
                if(result.includes('https://pastebin.com/')) {
                    alert("✅ REAL-TIME UPDATE SUCCESSFUL!\nID: " + PASTE_ID + " is now up to date.");
                } else {
                    alert("❌ ERROR: " + result + "\n\nTip: This paste must be created by your account.");
                }
            } catch (err) { alert("Network Sync Error!"); }
            toggleLoader(false);
        }

        // Helpers
        function openModal() { document.getElementById('editIdx').value = "-1"; document.querySelectorAll('#userModal input').forEach(i => i.value = ""); document.getElementById('userModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('userModal').classList.add('hidden'); }
        function editUser(i) {
            const u = masterData.users[i];
            document.getElementById('editIdx').value = i;
            document.getElementById('u-name').value = u.user;
            document.getElementById('u-pass').value = u.pass;
            document.getElementById('u-status').value = u.status;
            document.getElementById('u-exp').value = u.expiry;
            document.getElementById('u-did').value = u.device_id;
            document.getElementById('userModal').classList.remove('hidden');
        }
        function commitUser() {
            const i = document.getElementById('editIdx').value;
            const u = { user: document.getElementById('u-name').value, pass: document.getElementById('u-pass').value, status: document.getElementById('u-status').value, expiry: document.getElementById('u-exp').value, device_id: document.getElementById('u-did').value };
            if(i === "-1") masterData.users.unshift(u); else masterData.users[i] = u;
            closeModal(); render();
        }
        function deleteUser(i) { if(confirm("Confirm delete?")) { masterData.users.splice(i, 1); render(); } }
        function toggleLoader(s) { document.getElementById('loader').classList.toggle('hidden', !s); }
    </script>
</body>
</html>
