<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S360 VIP | Ultimate Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #050505; }
        body { font-family: 'Rajdhani', sans-serif; background: var(--bg); color: #fff; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(20, 20, 30, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(0, 242, 255, 0.1); }
        .neon-border { border: 1px solid rgba(0, 242, 255, 0.3); transition: 0.3s; }
        .neon-border:hover { border-color: var(--neon); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }
        input, select, textarea { background: rgba(0,0,0,0.5) !important; border: 1px solid #333 !important; color: white !important; outline: none !important; }
        input:focus { border-color: var(--neon) !important; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--neon); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen">

    <!-- Access Lock -->
    <div id="authOverlay" class="fixed inset-0 z-[9999] glass flex items-center justify-center p-4">
        <div class="max-w-md w-full p-8 rounded-3xl border-t-4 border-cyan-500 bg-black shadow-2xl">
            <h2 class="orbitron text-center text-xl mb-6 text-cyan-400">ADMIN ACCESS ONLY</h2>
            <input type="password" id="adminPass" class="w-full p-4 rounded-xl text-center mb-4 text-2xl tracking-[1em]" placeholder="****">
            <button onclick="checkAuth()" class="w-full bg-cyan-600 hover:bg-cyan-500 py-4 rounded-xl font-bold orbitron transition">UNLOCK SYSTEM</button>
            <p id="errorMsg" class="text-red-500 text-center mt-4 hidden">INVALID ACCESS KEY!</p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden">
        <!-- Header -->
        <nav class="p-4 glass sticky top-0 z-50 border-b border-cyan-900/50">
            <div class="container mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-cyan-500 p-2 rounded-lg text-black font-black">S360</div>
                    <h1 class="orbitron text-lg hidden md:block">ULTIMATE CONTROL</h1>
                </div>
                <div class="flex gap-2">
                    <button onclick="fetchData()" class="bg-slate-800 p-2 px-4 rounded-lg font-bold text-sm"><i class="fas fa-sync"></i></button>
                    <button onclick="openModal()" class="bg-cyan-600 px-4 py-2 rounded-lg font-bold text-sm">ADD USER</button>
                    <button onclick="uploadToPastebin()" class="bg-green-600 px-4 py-2 rounded-lg font-bold text-sm shadow-lg shadow-green-500/20">SAVE ONLINE</button>
                </div>
            </div>
        </nav>

        <div class="container mx-auto p-4 md:p-8">
            <!-- App Settings -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-10">
                <div class="lg:col-span-2 glass p-6 rounded-3xl neon-border">
                    <h3 class="orbitron text-cyan-400 mb-4 flex items-center gap-2"><i class="fas fa-tools"></i> Global Config</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="text-[10px] text-gray-500 font-bold uppercase">Announcement</label>
                            <textarea id="app_ann" class="w-full p-3 rounded-xl mt-1 h-20 text-sm"></textarea>
                        </div>
                        <div>
                            <label class="text-[10px] text-gray-500 font-bold uppercase">Maintenance Msg</label>
                            <textarea id="app_m_msg" class="w-full p-3 rounded-xl mt-1 h-20 text-sm"></textarea>
                        </div>
                        <div class="flex gap-4">
                            <div class="flex-1">
                                <label class="text-[10px] text-gray-500 font-bold uppercase">Maint. Mode</label>
                                <select id="app_maint" class="w-full p-3 rounded-xl mt-1 text-sm">
                                    <option value="false">Live</option>
                                    <option value="true">Maintenance</option>
                                </select>
                            </div>
                            <div class="flex-1">
                                <label class="text-[10px] text-gray-500 font-bold uppercase">Announce Status</label>
                                <select id="app_ann_status" class="w-full p-3 rounded-xl mt-1 text-sm">
                                    <option value="on">On</option>
                                    <option value="off">Off</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="glass p-6 rounded-3xl border-t-4 border-purple-500">
                    <h3 class="orbitron text-purple-400 mb-4">Credentials</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="text-[10px] text-gray-500">PASTEBIN API KEY</label>
                            <input type="text" id="apiKey" value="KuBOD7AbDjnhSKrm9MxVqf3n48ZTWUx9" class="w-full p-2 rounded-lg mt-1 text-xs font-mono">
                        </div>
                        <div>
                            <label class="text-[10px] text-gray-500">CURRENT PASTE ID</label>
                            <input type="text" id="pasteId" value="LGU5MbB1" class="w-full p-2 rounded-lg mt-1 text-xs font-mono">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Stats -->
            <div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <!-- Stats injected here -->
            </div>

            <!-- User Cards -->
            <div id="userGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Cards injected here -->
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 z-[2000] hidden bg-black/90 flex items-center justify-center p-4">
        <div class="glass max-w-md w-full rounded-3xl overflow-hidden border-t-4 border-cyan-500">
            <div class="p-6 border-b border-white/5 flex justify-between">
                <h3 id="modalTitle" class="orbitron">USER DATA</h3>
                <button onclick="closeModal()" class="text-xl">&times;</button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="editIndex">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="u_user" class="p-3 rounded-xl w-full" placeholder="Username">
                    <input type="text" id="u_pass" class="p-3 rounded-xl w-full" placeholder="Password">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <select id="u_status" class="p-3 rounded-xl w-full">
                        <option value="active">Active</option>
                        <option value="blocked">Blocked</option>
                    </select>
                    <input type="text" id="u_expiry" class="p-3 rounded-xl w-full" placeholder="YYYY-MM-DD">
                </div>
                <input type="text" id="u_device" class="p-3 rounded-xl w-full" placeholder="Device ID (ANY)">
                <button onclick="saveUserLocal()" class="w-full bg-cyan-600 py-4 rounded-2xl orbitron font-bold">SAVE TO LIST</button>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loader" class="fixed inset-0 z-[3000] hidden bg-black/80 flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="orbitron text-cyan-500 animate-pulse">TRANSMITTING DATA...</p>
    </div>

    <script>
        const PIN = "admin123"; // আপনার পাসওয়ার্ড
        let localData = { app_config: {}, users: [] };

        function checkAuth() {
            if(document.getElementById('adminPass').value === PIN) {
                document.getElementById('authOverlay').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                fetchData();
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        async function fetchData() {
            showLoader(true);
            const pid = document.getElementById('pasteId').value;
            try {
                // Using a more reliable proxy
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://pastebin.com/raw/'+pid)}&ts=${Date.now()}`);
                const data = await res.json();
                localData = JSON.parse(data.contents);
                renderUI();
            } catch (e) {
                alert("Failed to fetch data. Check Paste ID.");
            }
            showLoader(false);
        }

        function renderUI() {
            // Config
            document.getElementById('app_ann').value = localData.app_config.announcement;
            document.getElementById('app_m_msg').value = localData.app_config.m_msg;
            document.getElementById('app_maint').value = localData.app_config.maintenance.toString();
            document.getElementById('app_ann_status').value = localData.app_config.announcement_status;

            // Stats
            const active = localData.users.filter(u => u.status === 'active').length;
            document.getElementById('stats').innerHTML = `
                <div class="glass p-4 rounded-2xl text-center"><p class="text-[10px] text-gray-500">TOTAL</p><h2 class="text-2xl orbitron">${localData.users.length}</h2></div>
                <div class="glass p-4 rounded-2xl text-center border-b-2 border-green-500"><p class="text-[10px] text-gray-500">ACTIVE</p><h2 class="text-2xl orbitron text-green-400">${active}</h2></div>
                <div class="glass p-4 rounded-2xl text-center border-b-2 border-red-500"><p class="text-[10px] text-gray-500">BLOCKED</p><h2 class="text-2xl orbitron text-red-400">${localData.users.length - active}</h2></div>
                <div class="glass p-4 rounded-2xl text-center"><p class="text-[10px] text-gray-500">ID</p><h2 class="text-sm font-mono mt-2 text-cyan-500">${document.getElementById('pasteId').value}</h2></div>
            `;

            // Users
            const grid = document.getElementById('userGrid');
            grid.innerHTML = '';
            localData.users.forEach((u, i) => {
                grid.innerHTML += `
                    <div class="glass p-5 rounded-3xl neon-border relative group">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[10px] font-bold px-2 py-1 rounded bg-white/5 ${u.status === 'active' ? 'text-green-400' : 'text-red-400'}">${u.status.toUpperCase()}</span>
                            <div class="flex gap-2">
                                <button onclick="editUser(${i})" class="text-gray-500 hover:text-cyan-400"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteUser(${i})" class="text-gray-500 hover:text-red-500"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <h4 class="text-lg font-bold orbitron mb-3">${u.user}</h4>
                        <div class="text-[11px] font-mono space-y-1 opacity-70 bg-black/40 p-3 rounded-xl">
                            <p>PASS: ${u.pass}</p>
                            <p>EXP: ${u.expiry}</p>
                            <p class="truncate text-cyan-700">DID: ${u.device_id}</p>
                        </div>
                    </div>
                `;
            });
        }

        function openModal() {
            document.getElementById('editIndex').value = "-1";
            document.querySelectorAll('#modal input').forEach(i => i.value = "");
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function editUser(i) {
            const u = localData.users[i];
            document.getElementById('editIndex').value = i;
            document.getElementById('u_user').value = u.user;
            document.getElementById('u_pass').value = u.pass;
            document.getElementById('u_status').value = u.status;
            document.getElementById('u_expiry').value = u.expiry;
            document.getElementById('u_device').value = u.device_id;
            document.getElementById('modal').classList.remove('hidden');
        }

        function saveUserLocal() {
            const i = document.getElementById('editIndex').value;
            const userData = {
                user: document.getElementById('u_user').value,
                pass: document.getElementById('u_pass').value,
                status: document.getElementById('u_status').value,
                expiry: document.getElementById('u_expiry').value,
                device_id: document.getElementById('u_device').value
            };
            if(i === "-1") localData.users.unshift(userData);
            else localData.users[i] = userData;
            closeModal();
            renderUI();
        }

        function deleteUser(i) {
            if(confirm("Delete this user?")) {
                localData.users.splice(i, 1);
                renderUI();
            }
        }

        async function uploadToPastebin() {
            const key = document.getElementById('apiKey').value;
            if(!key) return alert("Missing API Key");

            if(!confirm("Push changes to Pastebin?")) return;
            
            showLoader(true);

            // Sync Config
            localData.app_config.announcement = document.getElementById('app_ann').value;
            localData.app_config.m_msg = document.getElementById('app_m_msg').value;
            localData.app_config.maintenance = document.getElementById('app_maint').value === 'true';
            localData.app_config.announcement_status = document.getElementById('app_ann_status').value;

            const params = new URLSearchParams();
            params.append('api_dev_key', key);
            params.append('api_option', 'paste');
            params.append('api_paste_code', JSON.stringify(localData, null, 2));
            params.append('api_paste_name', 'S360_UPDATE');
            params.append('api_paste_format', 'json');
            params.append('api_paste_private', '0');

            try {
                // Fixed CORS issue using a dynamic proxy
                const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://pastebin.com/api/api_post.php'), {
                    method: 'POST',
                    body: params
                });

                const result = await response.text();
                if(result.includes('https://pastebin.com/')) {
                    const newId = result.split('/').pop();
                    alert("✅ SYNC SUCCESSFUL!\nNew Paste ID: " + newId);
                    document.getElementById('pasteId').value = newId;
                    renderUI();
                } else {
                    alert("Pastebin Error: " + result);
                }
            } catch (e) {
                alert("Network Error. Could not sync.");
            }
            showLoader(false);
        }

        function showLoader(s) { document.getElementById('loader').classList.toggle('hidden', !s); }
    </script>
</body>
</html>
